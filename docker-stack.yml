# Swarm stack file. File only — never run `docker swarm init` or `docker stack deploy`
# as part of this exercise. Validated with `docker compose -f docker-stack.yml config`.
#
# Swarm ignores `depends_on` entirely (it only exists in the Compose spec, not the
# Swarm spec) — there is no "wait for this other service to be healthy" primitive here.
# Startup ordering is instead handled by two things that already exist in this stack:
#   1. `restart_policy` on every service — a container that crashes because a
#      dependency isn't up yet gets restarted automatically (with a delay) until it is.
#   2. The app's own retry logic — app/api/src/queue.js already retries Redis and
#      RabbitMQ connections (15 attempts, 2s apart) before giving up, and Postgres
#      healthchecks aside, `pg` + `minio` client libraries also fail fast and get
#      retried the same way via container restarts.

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
  data:
    driver: overlay

volumes:
  pg_data:
  minio_data:

configs:
  nginx_conf:
    file: ./app/nginx.conf

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      # Swarm's routing mesh (ingress mode, the default) publishes on ALL nodes'
      # interfaces by design — there is no per-port "bind to 127.0.0.1 only" option
      # the way plain `docker run -p 127.0.0.1:...` has. That's why the RabbitMQ,
      # MailHog, and MinIO console UI ports from docker-compose.yml are dropped
      # below instead of republished here: publishing them in Swarm would expose
      # them on every node's public interface, which breaks "only gateway is public".
      - target: 8080
        published: "${GATEWAY_PORT}"
        mode: ingress
    networks:
      - frontend
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  frontend:
    image: faiqua6/campushub-frontend:1.0
    networks:
      - frontend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  api:
    image: faiqua6/campushub-api:1.0
    env_file: .env
    networks:
      - backend
      - data
    deploy:
      # Exactly 1 replica: `npm start` runs `node src/migrate.js && node src/server.js`
      # on every container start. migrate.js is not designed to be run concurrently —
      # two replicas starting at once could both see "0 events" and both try to
      # INSERT the seed rows, or race on the "CREATE TABLE IF NOT EXISTS" /
      # bucket-creation calls. Since app/api isn't allowed to change, the safe
      # Docker-side answer is to not run it concurrently in the first place.
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  worker:
    image: faiqua6/campushub-api:1.0
    command: ["node", "src/worker.js"]
    env_file: .env
    networks:
      - data
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend
      - data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks:
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
